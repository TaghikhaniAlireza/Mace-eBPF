name: NoyanSecOps
on: [workflow_dispatch, push]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run NoyanSecOps
        uses: TaghikhaniAlireza/NoyanSecOps@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
